name: Render keepalive

on:
  schedule:
    # Keep the Free Render instance receiving traffic during 06:00-24:00
    # Beijing time. GitHub Actions cron uses UTC, so we split the window.
    - cron: "*/5 22-23 * * *"
    - cron: "*/5 0-15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RENDER_HEALTHCHECK_URL: https://antigravity-external-gateway.onrender.com/health
    steps:
      - name: Request Render health endpoint
        shell: bash
        run: |
          test -n "$RENDER_HEALTHCHECK_URL" || {
            echo "Render health-check URL is missing." >&2
            exit 1
          }
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 10 --max-time 120 --output /dev/null \
            "$RENDER_HEALTHCHECK_URL"
