name: Render keepalive

on:
  schedule:
    # Keep Free Render services receiving traffic during 06:00-24:00
    # Beijing time. GitHub Actions cron uses UTC, so this window is split.
    - cron: "*/5 22-23 * * *"
    - cron: "*/5 0-15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KEEPALIVE_URLS: |
        https://antigravity-external-gateway.onrender.com/health
        https://zeabur-antigravity-bridge.onrender.com/health
      KEEPALIVE_ROUNDS: "2"
      KEEPALIVE_SLEEP_SECONDS: "240"
    steps:
      - name: Request Render health endpoints
        shell: bash
        run: |
          set -u

          mapfile -t urls < <(printf '%s\n' "$KEEPALIVE_URLS" | sed '/^[[:space:]]*$/d')
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "No keepalive URLs are configured." >&2
            exit 1
          fi

          for round in $(seq 1 "$KEEPALIVE_ROUNDS"); do
            echo "Keepalive round ${round}/${KEEPALIVE_ROUNDS}"
            for url in "${urls[@]}"; do
              echo "Pinging ${url}"
              curl --fail --silent --show-error --location \
                --retry 2 --retry-delay 10 --max-time 120 --output /dev/null \
                "$url" || echo "::warning::Keepalive request failed for ${url}"
            done

            if [ "$round" -lt "$KEEPALIVE_ROUNDS" ]; then
              sleep "$KEEPALIVE_SLEEP_SECONDS"
            fi
          done
