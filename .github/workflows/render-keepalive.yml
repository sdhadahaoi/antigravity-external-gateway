name: Render keepalive

on:
  schedule:
    # GitHub Actions cron is UTC. These are 07:01 and 07:50 through
    # 23:01 and 23:50 in China Standard Time (UTC+8), every day.
    - cron: "1 0-15,23 * * *"
    - cron: "50 0-15,23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RENDER_HEALTHCHECK_URL: https://antigravity-external-gateway.onrender.com/health
    steps:
      - name: Request Render health endpoint
        shell: bash
        run: |
          test -n "$RENDER_HEALTHCHECK_URL" || {
            echo "Render health-check URL is missing." >&2
            exit 1
          }
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 10 --max-time 120 --output /dev/null \
            "$RENDER_HEALTHCHECK_URL"
