services:
  - type: web
    runtime: node
    name: antigravity-external-gateway
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Render injects PORT for web services. Keep this unsynced when using a Blueprint.
      - key: PORT
        sync: false
      # This unlocks only the gateway administration UI/API, never the upstream bridge.
      - key: GATEWAY_ADMIN_KEY
        generateValue: true
      # These are the original bridge deployment details. Set them in Render; never commit them.
      - key: UPSTREAM_BRIDGE_URL
        sync: false
      - key: UPSTREAM_BRIDGE_API_KEY
        sync: false
      # Free services have ephemeral filesystems. Use the dashboard backup/export
      # buttons to preserve friend URLs and API keys across restarts.
      - key: GATEWAY_DATA_DIR
        value: /tmp/gateway-data
      # Optional seed JSON for restoring friend channels after Free instance restarts.
      # Paste the dashboard's friend backup JSON here when you need automatic recovery.
      - key: GATEWAY_FRIENDS_JSON
        sync: false
      # Public address for the administrator-only surface, e.g. https://admin.example.com.
      - key: GATEWAY_ADMIN_BASE_URL
        sync: false
      # Public address for the friend portal and external API, e.g. https://api.example.com.
      # Generated channel URLs use this value, never the admin surface address.
      - key: GATEWAY_USER_BASE_URL
        sync: false
      # Legacy single-domain compatibility fallback. Leave unset on new dual-domain deployments.
      - key: GATEWAY_PUBLIC_BASE_URL
        sync: false
      - key: GATEWAY_MAX_BODY_BYTES
        value: "10485760"
      - key: GATEWAY_MAX_PENDING_BODY_READS
        value: "2"
